name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: Test / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: 22 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package version
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME !== "v"+p.version) process.exit(1)'
      - name: Build installable package
        run: |
          npm pack
          sha256sum codex-workflow-*.tgz > SHA256SUMS.txt
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" codex-workflow-*.tgz SHA256SUMS.txt --verify-tag --title "Codex Orchestrator $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
